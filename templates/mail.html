<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <title>Messages</title>
</head>
<body>

    <h1>Your Messages</h1>

    <ul>
    {% for mail in mails %}
        {% if mail[1] == username %}
            <li style="line-height: 1.5;">{{ mail[2] }}</li>
        {% endif %}
    {% endfor %}
        </ul>

</body>
</html>
